# Publishes server.json to the MCP Registry when a tag such as v1.0.2 is pushed.
# The name com.opendiavgeia/diavgeia is proved by a TXT record on opendiavgeia.com;
# MCP_REGISTRY_KEY is that record's ed25519 private key, as hex.
name: Publish to the MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "v$(jq -r .version server.json)" = "${GITHUB_REF_NAME}"

      - name: Publish
        env:
          MCP_REGISTRY_KEY: ${{ secrets.MCP_REGISTRY_KEY }}
        run: |
          if [ -z "$MCP_REGISTRY_KEY" ]; then
            echo "::warning::MCP_REGISTRY_KEY is not set, so nothing was published. Add it, then run this workflow again."
            exit 0
          fi
          ./mcp-publisher login dns --domain opendiavgeia.com --private-key "$MCP_REGISTRY_KEY"
          ./mcp-publisher publish

  release:
    # The release is made by the workflow, so it carries the bot's name rather than a person's.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Release with this version's changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## "v"," {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
